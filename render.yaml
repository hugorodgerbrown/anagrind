# Render static site. No backend, no build image dependencies.
#
# dist/ is committed, so Render publishes it as-is and the build cannot fail on
# a missing Python or a slow pip install. Rebuild it locally with
# `python3 build_dist.py` and commit the result.
services:
  - type: web
    name: anagrind
    runtime: static
    buildCommand: ""
    staticPublishPath: ./dist

    headers:
      # The worker decides what is cached, so it must never itself be stale.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # index.html changes on every deploy and is small next to the win of
      # never serving an old dictionary.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Icons are content-stable; let the browser keep them.
      - path: /*.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
